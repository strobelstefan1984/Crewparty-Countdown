<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crewparty – Countdown</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;
       background:linear-gradient(135deg,#fff7bf,#f4f7f1 45%,#d9f0d0);
       display:flex;align-items:center;justify-content:center;padding:24px;color:#172018}
  .card{width:min(760px,100%);background:white;border-radius:28px;padding:34px 26px;
        box-shadow:0 16px 50px rgba(0,0,0,.15);text-align:center}
  h1{font-size:clamp(42px,9vw,78px);margin:0 0 4px;font-weight:900;letter-spacing:-2px}
  .subtitle{font-size:clamp(22px,4vw,34px);font-weight:800;margin:0 0 22px}
  .where{font-size:18px;margin:8px 0 26px}
  .timer{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 24px}
  .unit{background:#172018;color:white;border-radius:18px;padding:18px 8px}
  .num{font-size:clamp(38px,8vw,68px);font-weight:900;line-height:1}
  .label{font-size:13px;text-transform:uppercase;letter-spacing:1.5px;margin-top:7px}
  .info{font-size:17px;line-height:1.5;margin:16px 0}
  a{display:inline-block;margin-top:10px;padding:14px 20px;border-radius:14px;
    background:#f5d400;color:#172018;text-decoration:none;font-weight:800}
  .done{font-size:42px;font-weight:900;margin:25px 0}
</style>
</head>
<body>
<div class="card">
  <h1>🎉 CREWPARTY</h1>
  <div class="subtitle">Morgen ab 15:30 Uhr!</div>
  <div class="where">📍 Matea’s Garten am Struckbachteich</div>

  <div id="timer" class="timer">
    <div class="unit"><div id="hours" class="num">--</div><div class="label">Stunden</div></div>
    <div class="unit"><div id="minutes" class="num">--</div><div class="label">Minuten</div></div>
    <div class="unit"><div id="seconds" class="num">--</div><div class="label">Sekunden</div></div>
  </div>

  <div id="message" class="info">🔥 Grillgut · 🥗 Salate & Snacks · ⚽ Ballspiele</div>
  <a href="https://goo.gl/maps/Q6YPZM5z59HqxndG7" target="_blank" rel="noopener">📍 Weg zu Matea’s Garten</a>
</div>

<script>
const target = new Date("2026-09-09T15:30:00+02:00").getTime();

function update() {
  const diff = target - Date.now();
  if (diff <= 0) {
    document.getElementById("timer").innerHTML =
      '<div class="done" style="grid-column:1/-1">🎉 JETZT GEHT’S LOS! 🎉</div>';
    document.getElementById("message").textContent =
      "Wir freuen uns auf euch!";
    return;
  }
  const totalSeconds = Math.floor(diff / 1000);
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  const s = totalSeconds % 60;
  document.getElementById("hours").textContent = String(h).padStart(2,"0");
  document.getElementById("minutes").textContent = String(m).padStart(2,"0");
  document.getElementById("seconds").textContent = String(s).padStart(2,"0");
}
update();
setInterval(update, 1000);
</script>
</body>
</html>
