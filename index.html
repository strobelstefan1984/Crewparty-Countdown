<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crewparty – Countdown</title>

<style>
  *{box-sizing:border-box}

  /* Animierter Hintergrund */
  body{
    margin:0;
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(135deg,#fff7bf,#f4f7f1,#d9f0d0,#ffe8c2);
    background-size:400% 400%;
    animation:bgMove 12s ease infinite;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    color:#172018;
  }

  @keyframes bgMove{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
  }

  .card{
    width:min(760px,100%);
    background:white;
    border-radius:28px;
    padding:34px 26px;
    box-shadow:0 16px 50px rgba(0,0,0,.15);
    text-align:center;
    position:relative;
    z-index:10;
  }

  h1{font-size:clamp(42px,9vw,78px);margin:0 0 4px;font-weight:900;letter-spacing:-2px}
  .subtitle{font-size:clamp(22px,4vw,34px);font-weight:800;margin:0 0 22px}
  .where{font-size:18px;margin:8px 0 26px}

  .timer{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin:18px 0 24px;
  }

  .unit{
    background:#172018;
    color:white;
    border-radius:18px;
    padding:18px 8px;
  }

  .num{font-size:clamp(38px,8vw,68px);font-weight:900;line-height:1}
  .label{font-size:13px;text-transform:uppercase;letter-spacing:1.5px;margin-top:7px}

  .info{font-size:17px;line-height:1.5;margin:16px 0}
  a{
    display:inline-block;
    margin-top:10px;
    padding:14px 20px;
    border-radius:14px;
    background:#f5d400;
    color:#172018;
    text-decoration:none;
    font-weight:800;
  }

  .done{font-size:42px;font-weight:900;margin:25px 0}

  /* Fade-In Effekt */
  .fade-in{
    opacity:0;
    animation:fadeIn 2s forwards;
  }

  @keyframes fadeIn{
    from{opacity:0}
    to{opacity:1}
  }

  /* Konfetti Canvas */
  #confettiCanvas{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:1;
  }
</style>
</head>

<body>

<canvas id="confettiCanvas"></canvas>

<div class="card">
  <h1>🎉 CREWPARTY</h1>
  <div class="subtitle">Morgen ab 15:30 Uhr!</div>
  <div class="where">📍 Matea’s Garten am Struckbachteich</div>

  <div id="timer" class="timer">
    <div class="unit"><div id="hours" class="num">--</div><div class="label">Stunden</div></div>
    <div class="unit"><div id="minutes" class="num">--</div><div class="label">Minuten</div></div>
    <div class="unit"><div id="seconds" class="num">--</div><div class="label">Sekunden</div></div>
  </div>

  <div id="message" class="info">🔥 Grillgut · 🥗 Salate & Snacks · ⚽ Ballspiele</div>

  <!-- Fade-In Text nach Ablauf -->
  <div id="afterText" class="info fade-in" style="display:none; font-size:22px; font-weight:800;">
    Die Party ist im Gange, du bist aber herzlich eingeladen auch jetzt noch dazuzustoßen!
  </div>

  <a href="https://goo.gl/maps/Q6YPZM5z59HqxndG7" target="_blank" rel="noopener">📍 Weg zu Matea’s Garten</a>
</div>

<script>
/* Countdown-Zielzeit */
const target = new Date("2026-09-09T15:30:00+02:00").getTime();

/* Konfetti-Funktion */
function startConfetti(){
  const canvas = document.getElementById("confettiCanvas");
  const ctx = canvas.getContext("2d");

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const confetti = [];
  const colors = ["#ff595e","#ffca3a","#8ac926","#1982c4","#6a4c93"];

  for(let i=0;i<150;i++){
    confetti.push({
      x:Math.random()*canvas.width,
      y:Math.random()*canvas.height-canvas.height,
      r:Math.random()*6+2,
      d:Math.random()*2+1,
      color:colors[Math.floor(Math.random()*colors.length)]
    });
  }

  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    confetti.forEach(c=>{
      ctx.beginPath();
      ctx.arc(c.x,c.y,c.r,0,Math.PI*2);
      ctx.fillStyle=c.color;
      ctx.fill();

      c.y+=c.d;
      if(c.y>canvas.height){
        c.y=-10;
        c.x=Math.random()*canvas.width;
      }
    });

    requestAnimationFrame(draw);
  }

  draw();
}

/* Countdown */
function update(){
  const diff = target - Date.now();

  if(diff <= 0){
    document.getElementById("timer").style.display="none";
    document.getElementById("message").style.display="none";

    const txt = document.getElementById("afterText");
    txt.style.display="block";

    startConfetti();
    return;
  }

  const totalSeconds = Math.floor(diff/1000);
  const h = Math.floor(totalSeconds/3600);
  const m = Math.floor((totalSeconds%3600)/60);
  const s = totalSeconds%60;

  document.getElementById("hours").textContent = String(h).padStart(2,"0");
  document.getElementById("minutes").textContent = String(m).padStart(2,"0");
  document.getElementById("seconds").textContent = String(s).padStart(2,"0");
}

update();
setInterval(update,1000);
</script>

</body>
</html>
